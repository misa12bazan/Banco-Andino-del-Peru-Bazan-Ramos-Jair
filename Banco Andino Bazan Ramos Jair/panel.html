<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de gestión - Banco Andino Perú</title>
<link rel="stylesheet" href="css/panel.css">
</head>
<body>
<header><a class="marca" href="index.html">Banco Andino Perú</a><nav id="nav"></nav></header>
<main><section class="tarjeta"><h1>Panel de gestión</h1>
<p id="msgPanel" class="msg" role="alert" hidden></p>
<div class="barra"><button type="button" id="btnNuevo">Nueva solicitud</button>
<div><label for="buscar">Buscar por código, nombre, DNI o estado</label><input id="buscar" type="search"></div>
<strong id="total"></strong></div>
<section id="seccionForm" class="tarjeta" hidden><h2 id="tituloForm">Nueva solicitud</h2>
<form id="formPanel"><input type="hidden" name="id_editar"><div class="grid">
<div><label for="nombres">Nombres</label><input id="nombres" name="nombres" required maxlength="80"></div>
<div><label for="apellidos">Apellidos</label><input id="apellidos" name="apellidos" required maxlength="80"></div>
<div><label for="dni">DNI</label><input id="dni" name="dni" required inputmode="numeric" pattern="[0-9]{8}" title="8 dígitos" maxlength="8"></div>
<div><label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" required pattern="9[0-9]{8}" title="9 dígitos, empieza con 9" maxlength="9"></div>
<div><label for="tipo_cuenta">Tipo de cuenta</label><select id="tipo_cuenta" name="tipo_cuenta" required><option value="ahorros">Ahorros</option><option value="corriente">Corriente</option><option value="sueldo">Sueldo</option></select></div>
<div><label for="moneda">Moneda</label><select id="moneda" name="moneda" required><option value="PEN">Soles (S/)</option><option value="USD">Dólares (US$)</option></select></div>
<div><label for="monto_inicial">Monto inicial</label><input id="monto_inicial" name="monto_inicial" type="number" min="0" step="0.01" required></div>
<div><label for="estado">Estado</label><select id="estado" name="estado"><option value="registrado">Registrado</option><option value="atendido">Atendido</option><option value="rechazado">Rechazado</option></select></div>
</div>
<p><button type="submit">Guardar</button> <button type="button" class="sec" id="btnCancelar">Cancelar</button></p></form></section>
<div class="tabla"><table><thead><tr><th>Código</th><th>Titular</th><th>Cliente</th><th>Cuenta</th><th>Monto inicial</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead>
<tbody id="cuerpo"></tbody></table></div></section></main>
<script type="module" src="js/panel/panel.js"></script>
</body>
</html>
